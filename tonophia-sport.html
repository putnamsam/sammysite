<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tonophia Photography Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Sofia+Sans+Extra+Condensed:wght@200&display=swap">
<style>
:root{--paper:#14110e;--ink:#ede6da;--muted:#a39a8c;--accent:#e0a148;--rule:#3a332b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 Barlow,system-ui,sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(100%,22rem);display:grid;gap:16px}
h1{margin:0;font:200 clamp(2.75rem,10vw,4rem)/0.95 "Sofia Sans Extra Condensed",sans-serif;text-transform:uppercase;letter-spacing:0.01em}
p{margin:0;color:var(--muted)}
label{font-weight:500}
input{width:100%;min-height:48px;padding:0 14px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:0;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:2px}
button{min-height:48px;border:0;border-radius:0;background:var(--accent);color:var(--paper);font:500 1rem Barlow,sans-serif;cursor:pointer}
button:disabled{opacity:0.6;cursor:wait}
#err{min-height:1.5em;color:var(--accent)}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="off">
<h1>Tonophia Photography</h1>
<p>A private redesign preview, the Sport version. Enter the password to view it.</p>
<label for="pw">Password</label>
<input id="pw" type="password" autofocus>
<button id="go" type="submit">View the preview</button>
<p id="err" role="status"></p>
</form>
</main>
