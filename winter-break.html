*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: calc(var(--nav-h) + var(--space-md)); scroll-behavior: smooth; }
body { margin: 0; background: var(--grain), var(--fibre), var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-weight: 500; font-size: 1.0625rem; line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent-2); }
::selection { background: color-mix(in oklab, var(--color-accent) 55%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: var(--color-accent-2); text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-synthesis: none; letter-spacing: var(--tracking-display); line-height: 1.04; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { max-width: 12ch; font-size: var(--text-display); }
h2 { max-width: 20ch; font-size: var(--text-section); }
h3 { font-size: var(--text-title); line-height: 1.15; }
p, ul, figure { margin: 0; }
p { text-wrap: pretty; }
img { max-width: 100%; height: auto; display: block; }
button, input { font: inherit; }
mark { background: color-mix(in oklab, var(--color-accent) 70%, transparent); color: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding-inline: var(--space-2xs); border-radius: var(--space-2xs); }
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.lead { font-size: var(--text-lead); line-height: 1.45; max-width: 44ch; color: var(--color-ink-2); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* The gate */
#gate { position: fixed; inset: 0; z-index: var(--z-modal); display: grid; place-items: center; padding: var(--space-lg); background: var(--grain), var(--fibre), var(--color-paper); }
.gate-sheet { position: relative; width: min(100%, 420px); filter: var(--shadow-paper); }
.gate-sheet > i { position: absolute; inset: 0; background: var(--grain), var(--fibre), var(--color-card); clip-path: var(--tear-band); }
.gate-in { position: relative; display: grid; gap: var(--space-md); padding: var(--space-2xl) var(--space-xl); text-align: left; }
.gate-in h1 { font-size: var(--text-section); max-width: 9ch; }
.gate-in label { font-size: var(--text-sm); color: var(--color-ink-2); }
#pw-input { height: 52px; border-radius: var(--radius-input); border: 1px solid var(--color-ink); background: var(--color-card); color: var(--color-ink); padding-inline: var(--space-md); width: 100%; }
#pw-input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
#gate-error { color: var(--color-ink); font-size: var(--text-sm); min-height: 1.4em; visibility: hidden; }

/* Card stock controls */
.btn { --edge: 5px; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 var(--space-lg); border: 0; border-radius: var(--radius-stock); font-weight: 600; font-size: var(--text-md); text-decoration: none; white-space: nowrap; cursor: pointer; color: var(--color-ink); background: var(--grain), var(--fibre), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule), 0 var(--edge) 0 0 var(--color-edge); transition: translate var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap); }
.btn--primary { background: var(--grain), var(--fibre), var(--color-accent); color: var(--color-accent-ink); box-shadow: 0 var(--edge) 0 0 var(--color-accent-deep), 2px calc(var(--edge) + 4px) 10px -3px color-mix(in oklab, var(--color-ink) 32%, transparent); transition-timing-function: var(--ease-spring); }
.btn:hover { --edge: 7px; translate: 0 -2px; }
.btn:active { --edge: 1px; translate: 0 4px; }
.btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
.btn:disabled { opacity: .6; cursor: not-allowed; translate: 0 0; }

/* Nav: a slab bar with a torn foot */
.bar { position: sticky; top: 0; z-index: var(--z-sticky-nav); filter: var(--shadow-paper); }
.bar > i { position: absolute; inset: 0; background: var(--grain), var(--fibre), var(--color-paper-2); clip-path: var(--tear-nav); }
.bar > i.f { background: var(--color-fringe); clip-path: var(--tear-nav-f); }
.bar-in { position: relative; display: flex; align-items: center; gap: var(--space-md); min-height: var(--nav-h); padding-bottom: var(--space-xs); }
.mark { font-weight: 600; font-size: var(--text-xl); letter-spacing: var(--tracking-display); color: var(--color-ink); text-decoration: none; margin-right: auto; white-space: nowrap; }

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const input = document.getElementById('pw-input');
  const btn = document.getElementById('pw-btn');
  const err = document.getElementById('gate-error');
  const pw = input.value.toLowerCase().trim();
  if (!pw) return;
  btn.disabled = true; err.style.visibility = 'hidden';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(VAULT.iv) }, key, b64(VAULT.ct));
    const app = document.getElementById('app');
    app.innerHTML = new TextDecoder().decode(plain);
    document.getElementById('gate').style.display = 'none';
    app.hidden = false;
    window.scrollTo(0, 0);
  } catch (e) {
    err.style.visibility = 'visible';
    input.value = '';
    input.focus();
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('pw-btn').addEventListener('click', unlock);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('pw-input').focus();

(function(){
  const lb = document.getElementById('lb'), cap = lb.querySelector('p'), im = new Image();
  lb.querySelector('figure').prepend(im);
  let list = [], i = 0, back = null;
  const big = u => u.replace(/width=\d+/, 'width=1600');
  function show(){ const el = list[i]; im.src = big(el.currentSrc || el.src); im.alt = el.alt || ''; const f = el.closest('figure'); cap.textContent = (f && f.querySelector('figcaption')) ? f.querySelector('figcaption').textContent : (el.alt || ''); }
  const SEL = '.mosaic figure, .stay > img, .thumbs img';
  document.getElementById('app').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches(SEL)) { e.preventDefault(); open(e.target); } });
  document.getElementById('app').addEventListener('click', e => { const el = e.target.closest(SEL); if (el) open(el); });
  function open(el) {
    const img = el.tagName === 'IMG' ? el : el.querySelector('img');
    const group = img.closest('.mosaic, .stay');
    list = Array.from(group.querySelectorAll('img'));
    i = list.indexOf(img); back = document.activeElement; show(); lb.classList.add('on'); document.body.style.overflow = 'hidden'; lb.querySelector('.x').focus();
  }
  function close(){ lb.classList.remove('on'); im.removeAttribute('src'); document.body.style.overflow = ''; if (back) back.focus(); }
  lb.querySelector('.x').addEventListener('click', close);
  lb.querySelector('.nx').addEventListener('click', e => { e.stopPropagation(); i = (i + 1) % list.length; show(); });
  lb.querySelector('.pv').addEventListener('click', e => { e.stopPropagation(); i = (i - 1 + list.length) % list.length; show(); });
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') lb.querySelector('.nx').click(); if (e.key === 'ArrowLeft') lb.querySelector('.pv').click(); });
  let x0 = null; lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) lb.querySelector(dx < 0 ? '.nx' : '.pv').click(); x0 = null; });
})();

(function(){
  const names = { bi: 'the Big Island', cr: 'Costa Rica', pr: 'Puerto Rico' };
  document.getElementById('app').addEventListener('change', e => {
    if (!e.target.matches('.love input')) return;
    const board = e.target.closest('.vote');
    const n = { bi: 0, cr: 0, pr: 0 };
    board.querySelectorAll('.love input:checked').forEach(c => c.dataset.places.split(' ').forEach(p => { n[p]++; }));
    const top = Math.max(n.bi, n.cr, n.pr);
    board.querySelectorAll('.tally li').forEach(li => { const k = li.dataset.place; li.querySelector('b').textContent = n[k]; li.classList.toggle('lead-pick', top > 0 && n[k] === top); });
    const out = board.querySelector('.verdict');
    const leaders = Object.keys(n).filter(k => top > 0 && n[k] === top);
    out.textContent = '';
    if (!leaders.length) { out.textContent = 'Tap the things you love and the votes add up here.'; return; }
    const m = s => { const x = document.createElement('mark'); x.textContent = s; return x; };
    if (leaders.length === 1) { out.append('Looks like ', m(names[leaders[0]]), ' is your trip.'); }
    else if (leaders.length === 2) { out.append("It's a tie between ", m(names[leaders[0]]), ' and ', m(names[leaders[1]]), '.'); }
    else { out.append('All three are tied. Pick one more thing you love.'); }
  });
})();
</script>
</body>
