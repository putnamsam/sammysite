<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Three ways to do Costa Rica over winter break, with photos and costs.">
<meta name="theme-color" content="#1f6a43">
<title>Winter Break 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&amp;family=Manrope:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: Photographic, a Costa Rica plan picker: date tiles, three plan chapters, a cost card and a vote · genre: playful · theme: Squeeze · redesign: full
 * hero: a big headline over the beach photo with the trip's dates as tiles · nav: a green bar with three plan links and the vote control · footer: good to know rows over the photo credits · imagery: photographs · signature: every plan as a day by day timetable of tiles with one big figure for the cost, and a three kid vote */
/* Hallmark · waive 83 · photographs past a third of the page · the kids choose from pictures and Sam asked that visuals win over text */
:root {
  color-scheme: dark;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;
  --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.25rem;
  --text-display: clamp(2.75rem, 6vw + 0.75rem, 6rem); --text-section: clamp(2.1rem, 3vw + 1rem, 3.75rem);
  --text-title: clamp(1.3rem, 0.8vw + 0.95rem, 1.75rem); --text-lead: clamp(1.125rem, 0.4vw + 1rem, 1.4rem);
  --text-figure: clamp(2.75rem, 4.5vw + 1rem, 5rem);
  --container: 1320px; --gutter: 56px; --section-gap: 128px;
  --color-paper: oklch(41% 0.100 154); --color-paper-2: oklch(47% 0.105 154); --color-paper-3: oklch(34% 0.090 156);
  --color-ink: oklch(99% 0.005 90); --color-ink-2: oklch(94% 0.020 120); --color-muted: oklch(90% 0.030 150); --color-rule: oklch(55% 0.100 154);
  --color-accent: oklch(83% 0.115 56); --color-accent-2: oklch(74% 0.150 46); --color-accent-ink: oklch(30% 0.070 40); --color-focus: oklch(88% 0.14 85);
  --color-card: oklch(97% 0.012 85); --color-card-ink: oklch(24% 0.05 160); --color-card-muted: oklch(40% 0.05 160);
  --font-display: "Gabarito", ui-sans-serif, system-ui, sans-serif; --font-body: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --radius-card: 24px; --radius-control: 16px; --radius-pill: 999px; --rule-hair: 1px; --rule-bar: 2px;
  --shadow-card: 0 14px 32px -16px oklch(22% 0.05 160 / 0.5);
  --tracking-display: -0.025em; --display-weight: 800;
  --scrim: linear-gradient(to top, oklch(34% 0.090 156 / 0.65) 0%, oklch(34% 0.090 156 / 0.45) 40%, transparent 72%);
  --nav-h: 72px;
}
@media (max-width: 60rem) { :root { --gutter: 24px; --section-gap: 96px; } }
@media (max-width: 40rem) { :root { --gutter: 16px; --section-gap: 72px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scroll-padding-top: calc(var(--nav-h) + var(--space-md)); scroll-behavior: smooth; }
body { margin: 0; background: var(--color-paper); color: var(--color-muted); font-family: var(--font-body); font-weight: 500; font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
::selection { background: var(--color-accent); color: var(--color-accent-ink); }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
a { color: var(--color-accent); text-decoration-thickness: 1.5px; text-underline-offset: 0.18em; }
a:hover { color: var(--color-ink); }
h1, h2, h3 { margin: 0; color: var(--color-ink); font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--tracking-display); line-height: 1.02; text-wrap: balance; overflow-wrap: break-word; }
h1 { font-size: var(--text-display); max-width: 13ch; }
h2 { font-size: var(--text-section); max-width: 18ch; }
h3 { font-size: var(--text-title); line-height: 1.12; }
p, ul, ol, figure, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
p { text-wrap: pretty; }
img { max-width: 100%; height: auto; display: block; }
button, input { font: inherit; }
mark { background: var(--color-accent); color: var(--color-accent-ink); border-radius: 6px; padding-inline: 6px; }
.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { display: block; font-weight: 700; font-size: var(--text-sm); color: var(--color-ink-2); }
.lead { font-size: var(--text-lead); max-width: 52ch; }
.fig { font-family: var(--font-display); font-weight: 800; letter-spacing: var(--tracking-display); color: var(--color-ink); line-height: 0.95; font-variant-numeric: tabular-nums; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 48px; padding: 12px 22px; border-radius: var(--radius-control); border: var(--rule-bar) solid var(--color-ink); background: transparent; color: var(--color-ink); font-weight: 700; text-decoration: none; cursor: pointer; transition: transform 120ms ease-out, background-color 120ms ease-out; }
.btn:hover { background: color-mix(in oklab, var(--color-ink) 10%, transparent); color: var(--color-ink); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.btn--primary:hover { background: var(--color-accent-2); border-color: var(--color-accent-2); color: var(--color-accent-ink); }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); }

/* nav */
.bar { position: sticky; top: 0; z-index: 300; background: var(--color-paper); border-bottom: var(--rule-hair) solid var(--color-rule); }
.bar-in { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--nav-h); }
.mark { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--color-ink); text-decoration: none; letter-spacing: var(--tracking-display); margin-right: auto; }
.knobs { display: flex; gap: var(--space-2xs); }
.knob { padding: 8px 14px; border-radius: var(--radius-pill); color: var(--color-ink-2); font-weight: 700; text-decoration: none; }
.knob:hover { background: var(--color-paper-2); color: var(--color-ink); }
.bar .btn { min-height: 44px; padding: 8px 18px; }
@media (max-width: 52rem) { .knobs { display: none; } }

/* hero */
.hero { padding-block: var(--space-2xl) var(--space-xl); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-xl); align-items: center; }
.hero-text { display: grid; gap: var(--space-lg); }
.hero-photo { position: relative; border-radius: var(--radius-card); overflow: hidden; aspect-ratio: 5 / 4; }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; }
.hero-photo figcaption { position: absolute; inset: auto 0 0 0; padding: var(--space-xl) var(--space-lg) var(--space-md); background: var(--scrim); color: var(--color-ink); font-weight: 700; }
@media (max-width: 60rem) { .hero-grid { grid-template-columns: 1fr; } }

/* timetables: dates as tiles */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-sm); }
.day { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-md) var(--space-md) var(--space-lg); display: grid; align-content: start; gap: var(--space-2xs); }
.day .fig { font-size: 3rem; }
.day .label { color: var(--color-muted); }
.day p { color: var(--color-ink-2); font-size: var(--text-md); line-height: 1.4; }
.day.go { background: var(--color-paper-3); }
.day .where { font-weight: 700; font-size: var(--text-sm); color: var(--color-accent); }
.hero .days { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: var(--space-xl); }
.hero .days .fig { font-size: var(--text-figure); }

section { padding-block: var(--section-gap) 0; }
.sec-head { display: grid; gap: var(--space-md); margin-bottom: var(--space-xl); }

/* plan picker tiles */
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
.pick { display: grid; grid-template-rows: auto 1fr; background: var(--color-paper-2); border-radius: var(--radius-card); overflow: hidden; color: inherit; text-decoration: none; transition: transform 120ms ease-out; }
.pick:active { transform: translateY(1px); }
.pick:hover { background: var(--color-paper-3); color: inherit; }
.pick img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-card); }
.pick-body { display: grid; gap: var(--space-sm); padding: var(--space-lg); align-content: start; }
.pick .fig { font-size: var(--text-figure); }
.pick .or { color: var(--color-ink-2); }
.pick .or b { color: var(--color-ink); }
@media (max-width: 60rem) { .picks { grid-template-columns: 1fr; } .pick { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); grid-template-rows: auto; } .pick img { height: 100%; aspect-ratio: auto; } }
@media (max-width: 34rem) { .pick { grid-template-columns: 1fr; } .pick img { aspect-ratio: 16 / 10; } }

/* bands, two at most */
.band { margin-top: var(--section-gap); padding-block: var(--space-3xl); }
.band--2 { background: var(--color-paper-2); }
.band--3 { background: var(--color-paper-3); }
.band + section { padding-top: var(--section-gap); }

/* flights */
.fly { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: var(--space-xl); align-items: start; }
.fly .fig { font-size: clamp(3.5rem, 7vw + 1rem, 7.5rem); }
.legs { display: grid; gap: var(--space-sm); }
.leg { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-lg); align-items: center; background: var(--color-paper); border-radius: var(--radius-card); padding: var(--space-lg); }
.leg .fig { font-size: 2.5rem; }
.leg p { color: var(--color-ink-2); }
.leg .to { text-align: right; }
.fly-note { margin-top: var(--space-md); font-size: var(--text-sm); }
@media (max-width: 60rem) { .fly { grid-template-columns: 1fr; } }
@media (max-width: 34rem) { .leg { grid-template-columns: 1fr; gap: var(--space-xs); } .leg .to { text-align: left; } }

/* a plan chapter */
.plan-top { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-xl); align-items: end; margin-bottom: var(--space-xl); }
.plan-top .label { color: var(--color-accent); font-size: 1rem; }
.plan-top h2 { margin-top: var(--space-xs); }
.plan-top .lead { margin-top: var(--space-md); }
.price { text-align: right; display: grid; gap: var(--space-2xs); justify-items: end; }
.price .fig { font-size: var(--text-figure); }
.price small { color: var(--color-ink-2); font-size: var(--text-md); max-width: 30ch; }
@media (max-width: 60rem) { .plan-top { grid-template-columns: 1fr; } .price { text-align: left; justify-items: start; } }
.plan-photo { border-radius: var(--radius-card); overflow: hidden; margin-bottom: var(--space-lg); }
.plan-photo img { width: 100%; aspect-ratio: 21 / 9; object-fit: cover; }
@media (max-width: 40rem) { .plan-photo img { aspect-ratio: 4 / 3; } }
.sub { margin: var(--space-2xl) 0 var(--space-lg); }

.stays { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); }
.stay { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-sm); display: grid; gap: var(--space-sm); align-content: start; }
.stay > img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 18px; cursor: zoom-in; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-xs); }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; cursor: zoom-in; }
.stay-body { display: grid; gap: var(--space-sm); padding: var(--space-sm) var(--space-sm) var(--space-md); }
.stay-meta { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.stay-meta span { padding: 4px 12px; border-radius: var(--radius-pill); background: var(--color-paper); color: var(--color-ink-2); font-weight: 700; font-size: var(--text-sm); }
.stay ul { display: grid; gap: 6px; }
.stay li { padding-left: 22px; position: relative; color: var(--color-ink-2); }
.stay li::before { content: ""; position: absolute; left: 4px; top: 0.62em; width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); }
.stay-cost { display: flex; align-items: baseline; gap: var(--space-sm); flex-wrap: wrap; }
.stay-cost .fig { font-size: 2.25rem; }
.links { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); font-weight: 700; }
.stay.alt { background: var(--color-paper-3); }
@media (max-width: 52rem) { .stays { grid-template-columns: 1fr; } }

.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); margin-top: var(--space-lg); }
.sum > div { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-lg); display: grid; gap: var(--space-2xs); }
.sum .fig { font-size: 2.5rem; }
.sum .tot { background: var(--color-paper-3); }
.swap { margin-top: var(--space-md); color: var(--color-ink-2); max-width: 70ch; }
@media (max-width: 40rem) { .sum { grid-template-columns: 1fr; } }

/* photos */
.mosaic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 220px; gap: var(--space-sm); }
.mosaic figure { position: relative; border-radius: var(--radius-card); overflow: hidden; cursor: zoom-in; }
.mosaic figure.w { grid-column: span 2; }
.mosaic figure.t { grid-row: span 2; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; }
.mosaic figcaption { position: absolute; inset: auto 0 0 0; padding: var(--space-xl) var(--space-md) var(--space-sm); background: var(--scrim); color: var(--color-ink); font-weight: 700; font-size: var(--text-sm); }
@media (max-width: 60rem) { .mosaic { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 180px; } }
.hint { margin-top: var(--space-sm); font-size: var(--text-sm); }

/* the one warm white card */
.card { background: var(--color-card); color: var(--color-card-ink); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: var(--space-xl); }
.card h2 { color: var(--color-card-ink); }
.card p { color: var(--color-card-muted); }
.card a { color: oklch(45% 0.13 46); }
.card table { width: 100%; border-collapse: collapse; margin-top: var(--space-lg); font-variant-numeric: tabular-nums; }
.card caption { caption-side: bottom; text-align: left; padding-top: var(--space-md); color: var(--color-card-muted); font-size: var(--text-sm); }
.card th, .card td { text-align: left; padding: var(--space-md) var(--space-sm); border-top: var(--rule-hair) solid oklch(88% 0.02 120); vertical-align: top; }
.card thead th { border-top: 0; font-size: var(--text-sm); color: var(--color-card-muted); }
.card td.n { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: var(--tracking-display); white-space: nowrap; }
.card tbody th { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.card tbody th small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--text-sm); color: var(--color-card-muted); }
.card .scroll { overflow-x: auto; }
@media (max-width: 40rem) { .card { padding: var(--space-lg) var(--space-md); } }

/* things to do */
.todo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
.todo a { display: grid; gap: var(--space-sm); background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-sm) var(--space-sm) var(--space-lg); color: inherit; text-decoration: none; }
.todo a:hover { background: var(--color-paper-3); }
.todo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 18px; }
.todo b { color: var(--color-ink); font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; padding-inline: var(--space-sm); }
.todo span { padding-inline: var(--space-sm); color: var(--color-ink-2); }
.todo .in { font-weight: 700; font-size: var(--text-sm); color: var(--color-accent); }
@media (max-width: 60rem) { .todo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 34rem) { .todo { grid-template-columns: 1fr; } }

/* vote */
.voters { display: grid; gap: var(--space-lg); }
.voter { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: var(--space-md); align-items: center; }
.voter legend { float: left; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--color-ink); padding: 0; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); }
.chip { position: relative; display: grid; gap: 2px; background: var(--color-paper-2); border-radius: var(--radius-control); padding: var(--space-md); cursor: pointer; transition: transform 120ms ease-out; }
.chip:active { transform: translateY(1px); }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip b { color: var(--color-ink); font-weight: 700; }
.chip small { color: var(--color-muted); font-size: var(--text-sm); }
.chip:has(input:checked) { background: var(--color-paper); box-shadow: 0 0 0 3px var(--color-accent); }
.chip:has(input:focus-visible) { outline: 3px solid var(--color-focus); outline-offset: 3px; }
@media (max-width: 48rem) { .voter { grid-template-columns: 1fr; } .chips { grid-template-columns: 1fr; } }
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); margin-top: var(--space-xl); }
.tally li { background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-lg); display: grid; gap: var(--space-2xs); }
.tally li .fig { font-size: var(--text-figure); }
.tally li.lead-pick { background: var(--color-paper); box-shadow: 0 0 0 3px var(--color-accent); }
.verdict { margin-top: var(--space-lg); font-size: var(--text-lead); color: var(--color-ink); font-weight: 700; }
@media (max-width: 34rem) { .tally li { padding: var(--space-md); } }

/* footer */
.foot { padding-block: var(--section-gap) var(--space-3xl); }
.rows { display: grid; gap: 0; margin-top: var(--space-lg); }
.rows li { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: var(--space-lg); padding-block: var(--space-lg); border-top: var(--rule-hair) solid var(--color-rule); }
.rows b { color: var(--color-ink); font-weight: 700; }
.rows p { max-width: 68ch; }
@media (max-width: 40rem) { .rows li { grid-template-columns: 1fr; gap: var(--space-2xs); } }
.credits { margin-top: var(--space-2xl); font-size: var(--text-sm); }
.credits div { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: var(--space-sm); }
.credits a { color: var(--color-muted); }

/* gate */
#gate { min-height: 100svh; display: grid; place-items: center; padding: var(--gutter); }
.gate-in { width: min(30rem, 100%); background: var(--color-paper-2); border-radius: var(--radius-card); padding: var(--space-xl); display: grid; gap: var(--space-md); }
.gate-in h1 { font-size: clamp(2.25rem, 5vw, 3.25rem); }
.gate-in label { font-weight: 700; color: var(--color-ink-2); }
#pw-input { min-height: 52px; border-radius: var(--radius-control); border: var(--rule-bar) solid var(--color-ink); background: var(--color-paper-3); color: var(--color-ink); padding: 10px 16px; }
#gate-error { visibility: hidden; color: var(--color-accent); font-weight: 700; }

/* photo viewer */
#lb { position: fixed; inset: 0; z-index: 400; display: none; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm); padding: var(--space-lg); background: oklch(22% 0.06 156 / 0.94); }
#lb.on { display: grid; }
#lb figure { display: grid; gap: var(--space-sm); justify-items: center; }
#lb img { max-height: 80svh; width: auto; border-radius: var(--radius-card); }
#lb p { color: var(--color-ink); font-weight: 700; text-align: center; }
#lb button { min-height: 48px; padding: 8px 16px; border-radius: var(--radius-control); border: var(--rule-bar) solid var(--color-ink); background: transparent; color: var(--color-ink); font-weight: 700; cursor: pointer; }
#lb .x { position: absolute; top: var(--space-md); right: var(--space-md); background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); font-size: 1.5rem; line-height: 1; }
@media (max-width: 40rem) { #lb { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; padding: var(--space-md); } #lb figure { grid-column: 1 / -1; grid-row: 1; } #lb .pv { grid-row: 2; } #lb .nx { grid-row: 2; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-in">
    <h1>Winter break 2027</h1>
    <label for="pw-input">Enter the password to see the Costa Rica plans</label>
    <input type="password" id="pw-input" autocomplete="off">
    <button id="pw-btn" class="btn btn--primary" type="button">Open the page</button>
    <div id="gate-error" role="status">That's not it, try again</div>
  </div>
</div>

<div id="app" hidden></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const input = document.getElementById('pw-input');
  const btn = document.getElementById('pw-btn');
  const err = document.getElementById('gate-error');
  const pw = input.value.toLowerCase().trim();
  if (!pw) return;
  btn.disabled = true; err.style.visibility = 'hidden';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(VAULT.iv) }, key, b64(VAULT.ct));
    const app = document.getElementById('app');
    app.innerHTML = new TextDecoder().decode(plain);
    document.getElementById('gate').style.display = 'none';
    app.hidden = false;
    window.scrollTo(0, 0);
  } catch (e) {
    err.style.visibility = 'visible';
    input.value = '';
    input.focus();
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('pw-btn').addEventListener('click', unlock);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('pw-input').focus();

(function(){
  const lb = document.getElementById('lb'), cap = lb.querySelector('p'), im = new Image();
  lb.querySelector('figure').prepend(im);
  let list = [], i = 0, back = null;
  const big = u => u.replace(/width=\d+/, 'width=1600');
  function show(){ const el = list[i]; im.src = big(el.currentSrc || el.src); im.alt = el.alt || ''; const f = el.closest('figure'); cap.textContent = (f && f.querySelector('figcaption')) ? f.querySelector('figcaption').textContent : (el.alt || ''); }
  const SEL = '.mosaic figure, .stay > img, .thumbs img';
  document.getElementById('app').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches(SEL)) { e.preventDefault(); open(e.target); } });
  document.getElementById('app').addEventListener('click', e => { const el = e.target.closest(SEL); if (el) open(el); });
  function open(el) {
    const img = el.tagName === 'IMG' ? el : el.querySelector('img');
    const group = img.closest('.mosaic, .stay');
    list = Array.from(group.querySelectorAll('img'));
    i = list.indexOf(img); back = document.activeElement; show(); lb.classList.add('on'); document.body.style.overflow = 'hidden'; lb.querySelector('.x').focus();
  }
  function close(){ lb.classList.remove('on'); im.removeAttribute('src'); document.body.style.overflow = ''; if (back) back.focus(); }
  lb.querySelector('.x').addEventListener('click', close);
  lb.querySelector('.nx').addEventListener('click', e => { e.stopPropagation(); i = (i + 1) % list.length; show(); });
  lb.querySelector('.pv').addEventListener('click', e => { e.stopPropagation(); i = (i - 1 + list.length) % list.length; show(); });
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') lb.querySelector('.nx').click(); if (e.key === 'ArrowLeft') lb.querySelector('.pv').click(); });
  let x0 = null; lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) lb.querySelector(dx < 0 ? '.nx' : '.pv').click(); x0 = null; });
})();

(function(){
  const names = { a: 'Plan A, beach the whole time', b: 'Plan B, volcano then beach', c: 'Plan C, rainforest then beach' };
  document.getElementById('app').addEventListener('change', e => {
    if (!e.target.matches('.chip input')) return;
    const board = e.target.closest('.vote');
    const n = { a: 0, b: 0, c: 0 };
    board.querySelectorAll('.chip input:checked').forEach(c => { n[c.value]++; });
    const top = Math.max(n.a, n.b, n.c);
    board.querySelectorAll('.tally li').forEach(li => { const k = li.dataset.plan; li.querySelector('.fig').textContent = n[k]; li.classList.toggle('lead-pick', top > 0 && n[k] === top); });
    const out = board.querySelector('.verdict');
    const leaders = Object.keys(n).filter(k => top > 0 && n[k] === top);
    out.textContent = '';
    const m = s => { const x = document.createElement('mark'); x.textContent = s; return x; };
    if (!leaders.length) { out.textContent = 'Each of you tap one plan and the votes add up here.'; return; }
    if (leaders.length === 1) { out.append('Winning so far: ', m(names[leaders[0]]), '.'); }
    else if (leaders.length === 2) { out.append("It's a tie between ", m(names[leaders[0]]), ' and ', m(names[leaders[1]]), '.'); }
    else { out.append('A three way tie. Time for a family meeting.'); }
  });
})();
</script>
