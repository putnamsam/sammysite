<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Winter Break 2027</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --bg:#F4EFE6; --bg-warm:#EFE8DB; --dark:#17201C; --forest:#22332B; --mid:#4A5A4E;
    --muted:#8B9089; --rule:#D5CDBE; --paper:#EBE3D5; --gold:#C89B3C; --gold-lt:#E0C170;
    --green:#5B8C6E; --sage:#8AAB8E; --blue:#5E8299; --purple:#8B7BA6; --clay:#C07B54; --cream:#F9F5EC;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Inter',sans-serif; background:var(--dark); color:var(--dark); overflow-x:hidden; -webkit-font-smoothing:antialiased; }

  #gate { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 30%, #22332B 0%, #17201C 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; z-index:10; }
  #gate .sun { width:44px; height:44px; border-radius:50%; background:radial-gradient(circle, var(--gold-lt) 0%, var(--gold) 70%); box-shadow:0 0 40px rgba(200,155,60,.45); margin-bottom:6px; }
  #gate h1 { font-family:'Fraunces',serif; color:var(--cream); font-size:2.25rem; font-weight:500; letter-spacing:-0.02em; }
  #gate p { color:var(--muted); font-size:.875rem; letter-spacing:.02em; }
  #gate input { background:rgba(249,245,236,.06); border:1px solid rgba(249,245,236,.18); color:var(--cream);
    padding:14px 22px; border-radius:6px; font-size:1rem; font-family:'Inter',sans-serif; width:280px; max-width:100%;
    text-align:center; letter-spacing:.15em; outline:none; transition:border-color .2s; }
  #gate input:focus { border-color:var(--gold); }
  #gate button { background:var(--gold); color:var(--dark); border:none; padding:13px 40px; border-radius:6px;
    font-size:.8rem; font-family:'Inter',sans-serif; font-weight:600; cursor:pointer; letter-spacing:.12em; text-transform:uppercase; }
  #gate button:hover { background:var(--gold-lt); }
  #gate button:disabled { opacity:.6; cursor:wait; }
  #gate-error { color:var(--clay); font-size:.8rem; min-height:1rem; visibility:hidden; }

  #app { display:none; background:var(--bg); min-height:100vh; }

  .eyebrow { font-size:.65rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:14px; }
  .lede { font-size:1.1rem; color:var(--mid); line-height:1.8; max-width:620px; font-weight:300; }
  h2 { font-family:'Fraunces',serif; font-weight:500; font-size:2.25rem; letter-spacing:-0.02em; color:var(--dark); margin-bottom:16px; line-height:1.15; }
  h3 { font-family:'Fraunces',serif; font-weight:500; font-size:1.15rem; color:var(--dark); line-height:1.3; }
  .section { padding:88px 32px; max-width:1040px; margin:0 auto; }

  .hero { background:radial-gradient(ellipse at 70% 0%, #2c4236 0%, #17201C 75%); color:var(--cream); }
  .hero-inner { max-width:1040px; margin:0 auto; padding:120px 32px 96px; }
  .hero h1 { font-family:'Fraunces',serif; font-weight:500; font-size:clamp(2.4rem,6vw,4rem); letter-spacing:-0.03em; line-height:1.05; max-width:760px; margin-bottom:24px; }
  .hero .lede { color:rgba(249,245,236,.75); }
  .hero-meta { display:flex; flex-wrap:wrap; gap:10px; margin-top:32px; }
  .hero-meta span { font-size:.75rem; letter-spacing:.04em; color:var(--gold-lt); border:1px solid rgba(224,193,112,.35); border-radius:99px; padding:6px 14px; }

  .glance { margin-top:40px; border-top:1px solid var(--rule); }
  .glance-head, .glance-row { display:grid; grid-template-columns:1.4fr 1fr 1.3fr .7fr 1.5fr; gap:16px; align-items:center; padding:16px 4px; border-bottom:1px solid var(--rule); }
  .glance-head span { font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .glance-row { text-decoration:none; color:var(--mid); font-size:.9rem; transition:background .15s; }
  .glance-row:hover { background:var(--bg-warm); }
  .g-name { font-family:'Fraunces',serif; font-size:1.1rem; color:var(--dark); display:flex; align-items:center; gap:10px; }
  .g-name i { width:10px; height:10px; border-radius:50%; flex:none; }
  .g-total { font-weight:600; color:var(--dark); }

  .dest { background:var(--bg); border-top:1px solid var(--rule); }
  .dest.alt { background:var(--bg-warm); }
  .dest-top { display:flex; justify-content:space-between; gap:40px; align-items:flex-start; }
  .total-box { flex:none; background:var(--forest); color:var(--cream); border-radius:8px; padding:20px 24px; min-width:210px; }
  .tb-label { font-size:.62rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-lt); font-weight:600; }
  .tb-num { font-family:'Fraunces',serif; font-size:1.7rem; font-weight:500; margin:6px 0 4px; }
  .tb-sub { font-size:.78rem; color:rgba(249,245,236,.6); }

  .math { display:flex; flex-direction:column; gap:8px; margin:32px 0; padding:18px 22px; border-left:3px solid var(--gold); background:rgba(249,245,236,.6); border-radius:0 6px 6px 0; }
  .math span { font-size:.9rem; color:var(--mid); line-height:1.55; }
  .math b { color:var(--dark); font-weight:600; margin-right:4px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .card { background:var(--cream); border:1px solid var(--rule); border-radius:8px; padding:22px 24px; display:flex; flex-direction:column; gap:12px; }
  .card-top { display:flex; flex-direction:column; gap:6px; }
  .price { font-weight:600; color:var(--forest); font-size:1rem; }
  .price small { font-weight:400; color:var(--muted); font-size:.78rem; margin-left:3px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tags span { font-size:.72rem; background:var(--paper); color:var(--mid); border-radius:99px; padding:4px 10px; }
  .card p { font-size:.88rem; color:var(--mid); line-height:1.65; }

  .note { margin-top:24px; font-size:.88rem; color:var(--mid); line-height:1.6; background:rgba(192,123,84,.08); border:1px solid rgba(192,123,84,.3); border-radius:8px; padding:16px 20px; }
  .note b { color:var(--clay); }

  .closing { padding-bottom:120px; }
  .fine { list-style:none; margin-top:24px; display:flex; flex-direction:column; gap:12px; max-width:720px; }
  .fine li { font-size:.92rem; color:var(--mid); line-height:1.65; padding-left:20px; position:relative; }
  .fine li::before { content:''; position:absolute; left:0; top:.6em; width:8px; height:8px; border-radius:50%; background:var(--gold); }

  .postcards { display:grid; grid-template-columns:repeat(6,1fr); gap:0; background:var(--dark); }
  .postcard { position:relative; display:block; aspect-ratio:4/5; overflow:hidden; }
  .postcard img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s; }
  .postcard:hover img { transform:scale(1.05); }
  .postcard span { position:absolute; left:0; right:0; bottom:0; padding:28px 14px 12px; color:var(--cream); font-family:'Fraunces',serif; font-size:1.05rem; background:linear-gradient(transparent, rgba(23,32,28,.85)); }

  .picks { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:32px; }
  .picks div { background:var(--cream); border:1px solid var(--rule); border-radius:8px; padding:14px 18px; display:flex; flex-direction:column; gap:4px; }
  .picks b { font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .picks span { font-family:'Fraunces',serif; font-size:1.1rem; color:var(--dark); }

  .dest-photo { margin:0 0 40px; border-radius:10px; overflow:hidden; background:var(--paper); }
  .dest-photo img { width:100%; aspect-ratio:16/7; object-fit:cover; display:block; }
  .dest-photo figcaption { font-size:.75rem; color:var(--muted); padding:10px 14px; background:var(--cream); }

  .facts { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:32px; }
  .facts div { border-top:2px solid var(--gold); padding-top:12px; display:flex; flex-direction:column; gap:6px; }
  .facts b { font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--forest); font-weight:600; }
  .facts span { font-size:.86rem; color:var(--mid); line-height:1.55; }

  h3.sub { font-size:1.35rem; margin:44px 0 16px; }
  .card-links { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:auto; padding-top:6px; }
  .card-links a, .credits a { font-size:.8rem; font-weight:500; color:var(--blue); text-decoration:none; border-bottom:1px solid rgba(94,130,153,.35); }
  .card-links a:hover, .credits a:hover { color:var(--forest); border-color:var(--forest); }
  .card-links a::after { content:' \2197'; font-size:.7rem; }

  .acts { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .act { display:flex; flex-direction:column; background:var(--cream); border:1px solid var(--rule); border-radius:8px; overflow:hidden; text-decoration:none; color:inherit; transition:border-color .2s, transform .2s; }
  .act:hover { border-color:var(--gold); transform:translateY(-2px); }
  .act img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .act div { padding:16px 20px; display:flex; flex-direction:column; gap:6px; }
  .act b { font-family:'Fraunces',serif; font-weight:500; font-size:1.05rem; color:var(--dark); }
  .act b::after { content:' \2197'; font-family:'Inter',sans-serif; font-size:.75rem; color:var(--gold); }
  .act span { font-size:.86rem; color:var(--mid); line-height:1.6; }
  .act.noimg { border-left:3px solid var(--gold); }

  .plan { display:flex; flex-wrap:wrap; gap:10px; margin-top:32px; }
  .btn { display:inline-block; text-decoration:none; font-size:.78rem; font-weight:600; letter-spacing:.06em; padding:12px 20px; border-radius:6px; background:var(--forest); color:var(--cream); border:1px solid var(--forest); }
  .btn:hover { background:var(--dark); }
  .btn.ghost { background:transparent; color:var(--forest); }
  .btn.ghost:hover { background:var(--paper); }

  .credits { margin-top:48px; font-size:.8rem; color:var(--muted); line-height:1.6; }
  .credits b { color:var(--mid); }
  .credits div { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; }

  @media (max-width:760px) {
    .section { padding:64px 16px; }
    .hero-inner { padding:88px 16px 64px; }
    h2 { font-size:1.8rem; }
    .dest-top { flex-direction:column; gap:20px; }
    .total-box { width:100%; }
    .glance-head { display:none; }
    .glance-row { grid-template-columns:1fr auto; gap:6px 12px; padding:16px 4px; }
    .glance-row span[data-l] { grid-column:1 / -1; font-size:.82rem; }
    .glance-row span[data-l]::before { content:attr(data-l) ": "; color:var(--muted); }
    .cards { grid-template-columns:1fr; }
    .postcards { grid-template-columns:repeat(3,1fr); }
    .postcard span { font-size:.9rem; padding:24px 10px 10px; }
    .picks { grid-template-columns:1fr 1fr; }
    .facts { grid-template-columns:1fr 1fr; gap:18px 14px; }
    .acts { grid-template-columns:1fr; }
    .dest-photo img { aspect-ratio:4/3; }
    .btn { flex:1 1 100%; text-align:center; }
  }
</style>
</head>
<body>

  <div class="sun"></div>
  <h1>Winter Break 2027</h1>
  <p>Enter the password to continue</p>
  <input type="password" id="pw-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="off" />
  <button id="pw-btn" type="button">Enter</button>
  <div id="gate-error">That's not it, try again</div>
</div>

<div id="app"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const input = document.getElementById('pw-input');
  const btn = document.getElementById('pw-btn');
  const err = document.getElementById('gate-error');
  const pw = input.value.toLowerCase().trim();
  if (!pw) return;
  btn.disabled = true; err.style.visibility = 'hidden';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(VAULT.iv) }, key, b64(VAULT.ct));
    const app = document.getElementById('app');
    app.innerHTML = new TextDecoder().decode(plain);
    document.getElementById('gate').style.display = 'none';
    app.style.display = 'block';
    window.scrollTo(0, 0);
  } catch (e) {
    err.style.visibility = 'visible';
    input.value = '';
    input.focus();
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('pw-btn').addEventListener('click', unlock);
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('pw-input').focus();
</script>
